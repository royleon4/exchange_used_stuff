name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"
      NPM_CONFIG_OMIT: ""
      DATABASE_URL: postgresql://runner:runner@127.0.0.1:5432/exchange_test
      SESSION_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql --set=ON_ERROR_STOP=1 --command="CREATE ROLE runner LOGIN SUPERUSER PASSWORD 'runner';"
          sudo -u postgres createdb --owner=runner exchange_test
      - name: Install dependencies
        run: npm install --package-lock=false --include=dev --include=optional --no-audit --no-fund
      - name: Verify type dependencies
        run: npm ls typescript @types/node vitest
      - name: Run TypeScript check
        run: |
          set -o pipefail
          npm run check 2>&1 | tee check-output.txt
      - name: Prepare test database
        run: |
          set -o pipefail
          npm run db:push 2>&1 | tee database-output.txt
      - name: Run tests
        run: |
          set -o pipefail
          npm test -- --reporter=verbose 2>&1 | tee test-output.txt
      - name: Upload check diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-diagnostics
          path: |
            check-output.txt
            database-output.txt
            test-output.txt
          if-no-files-found: ignore
      - run: npm run build
