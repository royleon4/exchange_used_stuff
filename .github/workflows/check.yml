name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"
      NPM_CONFIG_OMIT: ""
      DATABASE_URL: postgresql:///exchange_test?host=/var/run/postgresql&user=runner
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres createuser --superuser runner
          sudo -u postgres createdb --owner=runner exchange_test
      - name: Install dependencies
        run: npm install --package-lock=false --include=dev --include=optional --no-audit --no-fund
      - name: Verify type dependencies
        run: npm ls typescript @types/node vitest
      - run: npm run check
      - name: Prepare test database
        run: npm run db:push
      - run: npm test -- --reporter=verbose
      - run: npm run build
