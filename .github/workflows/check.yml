name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"
      NPM_CONFIG_OMIT: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm install --package-lock=false --include=dev --include=optional --no-audit --no-fund
      - name: Verify type dependencies
        run: npm ls typescript @types/node vitest
      - run: npm run check
      - run: npm test
      - run: npm run build
